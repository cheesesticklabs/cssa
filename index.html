/* Preserve the completed page at its original viewport, plus a lossless annotated PNG. */

  const siteHtml=new XMLSerializer().serializeToString(html);
  const shapes=overlay.cloneNode(true);shapes.setAttribute('x','0');shapes.setAttribute('y','0');shapes.setAttribute('width',width);shapes.setAttribute('height',height);shapes.setAttribute('viewBox',`0 0 ${width} ${height}`);shapes.removeAttribute('class');

async function sha(text){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',encoder.encode(text)))].map(x=>x.toString(16).padStart(2,'0')).join('');}

 for(const [id,annotations]of Object.entries(state.evidence||{})){

function site(settings=defaults,learning=false){const full=learning||settings.content==='Full workshop details',group=learning||settings.structure==='Grouped sections',alt=learning||settings.alt==='Meaningful image description',size=learning?'Comfortable':settings.size,bold=learning||settings.style==='Bold';return `<!doctype html><html lang="en"><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#fffdf5;color:#20342e;font-family:Arial,sans-serif;font-size:${size==='Large'?24:size==='Compact'?12:17}px;line-height:1.55}header{background:${bold?'#ffd252':'#e7eee9'};padding:24px}h1{font-size:2em;line-height:1.1;color:#183c31;margin:6px 0}nav{display:flex;gap:18px;flex-wrap:wrap;background:#173e32;padding:12px 24px}nav a{color:white}main{padding:24px}.workshops{display:${group?'grid':'block'};grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}.card{border:${group?'2px solid #bccdc3':'0'};padding:${group?'18px':'4px'};margin-bottom:12px;background:${bold?'#fff2c7':'#f4f6f3'}}h2,h3{line-height:1.2}a{color:#174e40}a:focus-visible,button:focus-visible{outline:4px solid #bc1680;outline-offset:4px}button,.reserve{display:inline-block;border:0;border-radius:6px;padding:12px 18px;background:${bold?'#6237ab':'#274d41'};color:white;font:inherit;font-weight:bold}.art{font-size:45px;display:block;background:#dcebe5;padding:12px}footer{padding:20px;background:#e7eee9}small{font-size:.85em}</style></head><body><header><p>AFTER-SCHOOL STUDIO</p><h1>Make something after school</h1><p>Free workshops for students. Beginners welcome.</p></header><nav aria-label="Studio sections"><a href="#workshops">Workshops</a><a href="#visit">Visit us</a><a href="#reserve">Reserve a place</a></nav><main><h2 id="workshops">Workshops</h2><div class="workshops"><section class="card"><figure style="margin:0"><img class="art" src="${studioPhoto}" ${alt?'alt="A tan Chihuahua with upright ears and its tongue out, resting on a gray blanket"':''} style="width:100%;height:190px;object-fit:cover;padding:0"><figcaption style="font-size:.85em">Modeling reference: our workshop mascot</figcaption></figure><h3>3D Modeling Lab</h3><p>${full?'Learn to build a 3D model using the dog photo as a reference. Monday, 3:15–4:15 p.m. in Room 238. Materials provided.':'Build a 3D model with us. Ask around for details!'}</p></section><section class="card"><h3>Game Design</h3><p>${full?'Create a game using school computers. Wednesday, 3:15–4:15 p.m. in Room 238. No experience needed.':'Make a game. More information soon.'}</p></section></div><section id="visit"><h2>Visit us</h2><p>${full?'Meet in the computer science room after dismissal. No experience needed. Ask Mr. Pino in Room 238 about access needs.':'Come after school. We will see you there.'}</p></section><section id="reserve"><h2>Reserve a place</h2><p>Tell Mr. Pino which workshop you want to join.</p><a class="reserve" href="#reservation-note">How to reserve</a><p id="reservation-note">Ask Mr. Pino in Room 238 to reserve your place.</p></section></main><footer>After-School Studio</footer></body></html>`}
function browser(id,title){return `<div class="fake-browser"><div class="browser-bar"><span aria-hidden="true">● ● ●</span> <span>${title}</span></div><iframe id="${id}" title="${title}" sandbox="allow-same-origin"></iframe></div>`}
function readabilitySnippet(improved=false){return `<!doctype html><html lang="en"><meta charset="utf-8"><style>body{margin:0;padding:24px;background:#fff;font-family:Arial,sans-serif}.notice{padding:24px;background:#f5f5f5;border:1px solid #ddd;color:${improved?'#202b32':'#b5b5b5'};font-size:${improved?'20':'11'}px;line-height:1.6}h2{font-size:1.5em;margin-top:0}</style><div class="notice"><h2>Game Design</h2><p>Create a game using school computers.</p><p>Wednesday, 3:15–4:15 p.m.<br>Computer science room, Room 238.</p><p>Ask Mr. Pino to reserve a place.</p></div></html>`}

window.PurposeLab={render(p,c){ctx=c;if(p.id==='design'||p.id==='big')return `<div class="cssa-overview">${[['C','Content','What’s on it','Media and information.'],['S','Structure','How it’s organized','Headings, sections, and navigation.'],['S','Style','How it looks','Colors, fonts, sizes, and spacing.'],['A','Accessibility','Who can use it','Make the site usable for everyone.']].map(([letter,name,meaning,examples])=>`<section class="cssa-card"><span class="cssa-letter" aria-hidden="true">${letter}</span><h3>${name}</h3><strong>${meaning}</strong><p>${examples}</p></section>`).join('')}</div>${p.id==='big'?'':'<section class="block observe"><strong>Today</strong><p>Learn what each component contributes. Then design a page where they work together.</p></section>'}`;if(p.kind==='component')return c.block('observe',p.id==='accessibility'?'COMPARE · 2 MINUTES':'IDENTIFY · 2 MINUTES',`${p.id==='accessibility'?'<p>Compare the two 3D Modeling Lab boxes. One shows the photo; the other shows its alt text when the photo does not load.</p>':`<p>Find <strong>two examples of ${p.name[0]}</strong> in this website. Inspect the page, then select the two features below. You are identifying features, not changing the site.</p>`}${p.id==='accessibility'?'<div class="access-compare"><section><h3>Image loaded</h3>'+browser('example-site','studio.example / image loaded')+'</section><section><h3>Image not loaded</h3>'+browser('alt-example-site','studio.example / image not loaded')+'</section></div>':browser('example-site','studio.example / workshops')}${p.id==='accessibility'?'':`<fieldset class="feature-picks"><legend>${({content:'Which TWO choices provide information or media for the visitor?',structure:'Which TWO choices organize the page or help visitors find things?',style:'Which TWO choices change how the page looks?'}[p.id]||'Choose two examples.')}</legend>${({content:['Including the workshop’s time and room.','Making the page heading dark green.','Including a photo used as a modeling reference.','Putting workshop information in separate boxes.'],structure:['Putting links to Workshops and Visit Us in a menu.','Grouping each workshop’s information in its own box.','Making the page heading dark green.','Including a photo of a dog.'],style:['Putting links to Workshops and Visit Us in a menu.','Making the page heading dark green.','Including the workshop’s time and room.','Using a purple background and white text for the reservation button.']}[p.id]||candidates).map((v,i)=>`<label><input type="checkbox" data-pick="${v}" ${(c.state.mondayPicks?.[p.id]||[]).includes(v)?'checked':''}> ${v}</label>`).join('')}</fieldset><button class="secondary" id="check-picks">Check my examples</button><p id="pick-feedback" role="status"></p>`}${p.id==='accessibility'?'<div class="access-help"><p><strong>Compare:</strong> What can a visitor learn about the image when the photo does not load?</p></div><h3>Another example: readable text</h3><p>This Game Design announcement has the same information in both versions. Switch between them and notice what changes.</p><div class="compare-actions"><button class="secondary" id="read-original" aria-pressed="true">Original</button><button class="secondary" id="read-improved" aria-pressed="false">Improved</button><strong id="read-status" role="status">Original: small, low-contrast text</strong></div>'+browser('readability-site','studio.example / game design')+'':''}`);

ySnippet(improved);document.querySelector('#read-original').setAttribute('aria-pressed',String(!improved));document.querySelector('#read-improved').setAttribute('aria-pressed',String(improved));document.querySelector('#read-status').textContent=improved?'Improved: larger, higher-contrast text':'Original: small, low-contrast text';};document.querySelector('#read-original').onclick=()=>showReadability(false);document.querySelector('#read-improved').onclick=()=>showReadability(true);showReadability(false);}if(document.querySelector('#check-picks'))document.querySelector('#check-picks').onclick=()=>{const selected=c.state.mondayPicks?.[p.id]||[],correct=targets[p.id];document.querySelector('#pick-feedback').textContent=selected.length!==2?'Choose two examples, then check again.':correct.every(x=>selected.includes(x))?'These examples show '+p.name[0]+'. Now explain what one does for a visitor.':p.id==='structure'?'Reconsider your pair. Focus on how information is arranged or how a visitor moves through the page.':'Look again at the definition. Focus on what the selected features do on the page.';};}

function settings(record){const d=record.sites[record.selected]??=({...initial});if(d.content==='Useful details')d.content='Full details';if(d.alt==='Useful description')d.alt='Image description';return d;}
function webpage(id,d){const s=sites[id],dark=d.colors==='Dark contrast',mix=d.colors==='Bright mix',fg=dark?'#fff4df':mix?'#6b297b':'#173a33',bg=dark?'#182923':mix?'#fff59c':'#f4f7f2';const indexes=d.order==='Action first'?[2,0,1]:d.order==='Details first'?[0,1,2]:[1,2,0];const sections=indexes.map(i=>`<section id="part${i}"><h2>${esc(s.sections[i][0])}</h2><p>${esc(d.content==='Short teaser'?['Want to know more?','More coming soon.','Ask someone for details.'][i]:s.sections[i][1])}</p>${i===0&&id==='gallery'?`<p><strong>Photo: Close-up collection</strong></p>`:''}</section>`).join('');return `<!doctype html><html lang="en"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:${bg};color:${fg};font: ${d.size==='Large'?24:d.size==='Comfortable'?18:12}px/1.55 Arial,sans-serif}header,main,nav{padding:22px}header{background:${dark?'#2d4437':mix?'#ffb8ed':'#d8e8dd'}}h1{font-size:2em;line-height:1.1}h2{font-size:1.3em}nav{display:flex;gap:18px;flex-wrap:wrap}a{color:inherit}img{width:100%;height:240px;object-fit:contain;background:${dark?'#23372c':'#e4e6df'}}.sections{display:${d.layout==='Two columns'?'grid':'block'};grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}section{padding:${d.layout==='One long stream'?'4':'18'}px;border:${d.layout==='One long stream'?'0':'1px solid currentColor'};margin-bottom:16px;border-radius:8px}a:focus-visible{outline:3px solid #ed6800;outline-offset:4px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.gallery img{height:150px}figure{margin:0}figcaption{padding:8px}main{max-width:1050px;margin:auto}@media(max-width:480px){.sections{grid-template-columns:1fr}}</style><header><h1>${esc(s.name)}</h1><p>${esc(s.intro)}</p></header><nav aria-label="Sections">${s.sections.map((x,i)=>`<a href="#part${i}">${esc(x[0])}</a>`).join('')}</nav><main><figure><img src="${window.MEATBALL_PHOTOS[s.photo]}" ${d.alt==='Image description'?`alt="${esc(s.alt)}"`:''}><figcaption>${id==='gallery'?'Close-up collection: Meatball’s camera face.':esc(s.name)}</figcaption></figure><div class="sections">${sections}</div>${d.content==='Details + extra trivia'?`<aside><h2>One more thing</h2><p>${esc(s.extra)}</p></aside>`:''}${id==='game'||id==='gallery'?`<h2>Photo collection</h2><div class="gallery">${Object.values(sites).map((x,i)=>`<figure><img src="${window.MEATBALL_PHOTOS[x.photo]}" ${d.alt==='Image description'?`alt="${esc(x.alt)}"`:''}><figcaption>${['Blanket portrait','Camera close-up','Red-blanket nap','Behind the laptop'][i]}</figcaption></figure>`).join('')}</div>`:''}</main></html>`}
const originalWebpage=webpage;
webpage=function(id,d){
 const themes={fan:{accent:'#a34c2e',soft:'#f6e5d5',label:'THE OFFICIAL MEATBALL APPRECIATION SOCIETY',tag:'Meet your new favorite little guy.'},gallery:{accent:'#7c4c8a',soft:'#eee5f4',label:'THE MEATBALL COLLECTION',tag:'A very photogenic point of view.'},nap:{accent:'#2f736c',soft:'#deeee7',label:'REST & RELAXATION WITH MEATBALL',tag:'The art of doing absolutely nothing.'},game:{accent:'#3559bb',soft:'#e4eaff',label:'PLAYER ONE: MEATBALL',tag:'Small paws. Big game energy.'}};

 nav a:hover{background:${t.accent};color:white}
 main{padding:24px;max-width:1040px}
 main>figure{position:relative;background:${dark?'#223b32':t.soft};border-radius:18px;overflow:hidden;margin-bottom:26px;box-shadow:0 8px 24px #17241c12}

 main>figure figcaption{font:600 11px/1.5 Arial,sans-serif;padding:12px 16px;letter-spacing:.04em}
 .sections{gap:15px}
 section{border:${d.layout==='One long stream'?'0':'1px solid '+(dark?'#435750':'#e0e3d9')};background:${d.layout==='One long stream'?'transparent':dark?'#20342c':'#fffefa'};border-radius:14px;padding:${d.layout==='One long stream'?'8px 3px 16px':'20px'};box-shadow:${d.layout==='One long stream'?'none':'0 4px 14px #17241c08'}}

 section p,aside p{margin:0;font-family:Arial,sans-serif;line-height:1.7}

 ${id==='game'?`header h1{font-family:Arial,sans-serif;font-weight:900;letter-spacing:-.06em}nav a{border-radius:7px}section{border-radius:10px}.gallery figure{border-radius:10px}`:''}
 ${id==='gallery'?`header{background:${dark?'#2b2637':'#eee9f2'}}header h1{font-style:italic}.gallery img{height:230px}`:''}
 ${id==='nap'?`header h1{font-style:italic}section{border-radius:20px}nav a{font-weight:500}`:''}
 </style>`;
 return originalWebpage(id,d).replace('</style>', '</style>'+css);
};
function exportRecords(state){return Object.entries(state.meatballRedesigns||{}).flatMap(([id,r])=>[id==='redesign2'?'OPTIONAL REDESIGN 2':'REQUIRED REDESIGN 1','Selected website: '+sites[r.selected].name,...Object.entries(r.sites).map(([id,d])=>sites[id].name+': '+JSON.stringify(d)),...(r.beforeFeedback?['Before partner feedback: '+JSON.stringify(r.beforeFeedback)]:[])]);}

bind(p,c){if(p.kind!=='redesign')return base.bind(p,c);let original=false;const r=record(c.state,p.id);const save=()=>{c.state.answers[p.id+'-saved-designs']=JSON.stringify(r);c.persist()};const update=()=>{document.querySelector('#meatball-frame').srcdoc=webpage(r.selected,original?initial:settings(r));document.querySelector('#meatball-original').textContent=original?'Return to my design':'Show original';document.querySelector('#meatball-original').setAttribute('aria-pressed',String(original));document.querySelector('#meatball-status').textContent=original?'Original page':'Your design';};document.querySelector('#meatball-choice').onchange=e=>{r.selected=e.target.value;save();c.render()};document.querySelectorAll('[data-meatball]').forEach(el=>el.onchange=()=>{settings(r)[el.dataset.meatball]=el.value;original=false;save();update()});document.querySelector('#meatball-original').onclick=()=>{original=!original;update()};document.querySelector('#meatball-swap').onclick=()=>{r.beforeFeedback={site:r.selected,choices:{...settings(r)}};save();document.querySelector('#meatball-status').textContent='First design saved. Swap and ask for feedback.';};update();save();},
exportLines(c){return [...base.exportLines(c),...exportRecords(c.state)]},
printEvidence(c){return base.printEvidence(c)+(c.blank?'':`<section><h2>Meatball redesigns</h2><pre style="white-space:pre-wrap">${c.esc(exportRecords(c.state).join('\n'))}</pre></section>`)}
};
window.MeatballTest={sites,controls,initial,webpage,record,settings};
})();

const translateText=value=>{const raw=String(value),key=raw.trim();return dictionary[key]?raw.replace(key,dictionary[key]):raw;};
function translateTree(root){
 const doc=root.ownerDocument||root;
 const walker=doc.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){
  const parent=node.parentElement;
  if(!parent||parent.closest('script,style,textarea,[contenteditable="true"]'))continue;
  const translated=translateText(node.nodeValue);
  if(translated===node.nodeValue)continue;
  // Keep machine-readable option values stable while translating their visible labels.
  if(parent.tagName==='OPTION'&&!parent.hasAttribute('value'))parent.setAttribute('value',parent.value);
  node.nodeValue=translated;
 }
 for(const el of root.querySelectorAll('[alt],[title],[aria-label],button')){
  // The language toggle must offer English while Spanish is active.
  if(el.id==='language')continue;
  for(const attr of ['alt','title','aria-label'])if(el.hasAttribute(attr)){
   const old=el.getAttribute(attr),next=translateText(old);if(next!==old)el.setAttribute(attr,next);
  }
 }
}
function spanishHTML(html,full=false){
 const doc=new DOMParser().parseFromString(html,'text/html');
 translateTree(doc.body);
 if(full){doc.documentElement.lang='es';
  for(const style of doc.querySelectorAll('style')){
   let css=style.textContent;
   for(const [en,es]of Object.entries(dictionary))if(en===en.toUpperCase()&&en.length>8)css=css.split(en).join(es);
   style.textContent=css;
  }
  return '<!doctype html>'+doc.documentElement.outerHTML;
 }
 return doc.body.innerHTML;
}

 }
}
